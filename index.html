<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrap Data Dashboard - Line A</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">📊 Scrap Data Dashboard (A-Line)</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">อัปเดตล่าสุด: <span id="currentDate"></span></span>
        </div>
    </header>

    <div class="container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Form for Data Entry -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 lg:col-span-1">
            <h2 class="text-xl font-bold mb-4 text-blue-600 border-b pb-2">📝 กรอกข้อมูลประจำวัน</h2>
            <form id="dataForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">วันที่</label>
                    <input type="date" id="entryDate" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">ยอดผลิตทั้งหมด (Total Production)</label>
                    <input type="number" id="totalProd" min="1" required placeholder="เช่น 1000" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">จำนวนของเสีย (Scrap Qty)</label>
                    <input type="number" id="scrapQty" min="0" required placeholder="เช่น 15" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">% Scrap Rate (คำนวณให้อัตโนมัติ)</label>
                    <input type="text" id="scrapRate" readonly placeholder="0.00 %" class="w-full border rounded-lg p-2 bg-gray-100 font-bold text-red-600 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">
                    💾 บันทึกข้อมูล
                </button>
            </form>
        </div>

        <!-- Dashboard Display Area -->
        <div class="lg:col-span-2 space-y-6">

            <!-- Filter Controls -->
            <div class="bg-white p-4 rounded-xl shadow-md flex flex-wrap justify-between items-center gap-4">
                <span class="font-bold text-gray-700">มุมมองข้อมูล:</span>
                <div class="flex gap-2">
                    <button onclick="setFilter('daily')" id="btn-daily" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">รายวัน</button>
                    <button onclick="setFilter('weekly')" id="btn-weekly" class="filter-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300">รายสัปดาห์</button>
                    <button onclick="setFilter('monthly')" id="btn-monthly" class="filter-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300">รายเดือน</button>
                    <button onclick="setFilter('yearly')" id="btn-yearly" class="filter-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300">รายปี</button>
                </div>
            </div>

            <!-- Summary KPI Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">ยอดผลิตรวม</p>
                    <p class="text-2xl font-bold text-gray-800" id="kpiTotalProd">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500">
                    <p class="text-sm text-gray-500">ยอดของเสียรวม</p>
                    <p class="text-2xl font-bold text-red-600" id="kpiTotalScrap">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-yellow-500">
                    <p class="text-sm text-gray-500">อัตราของเสียเฉลี่ย (% Scrap)</p>
                    <p class="text-2xl font-bold text-yellow-600" id="kpiAvgRate">0.00%</p>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <h3 class="text-lg font-bold mb-4 text-gray-700" id="chartTitle">แนวโน้มของเสีย (Scrap Trend)</h3>
                <div class="relative h-64">
                    <canvas id="scrapChart"></canvas>
                </div>
            </div>

            <!-- Data Table -->
            <div class="bg-white rounded-xl shadow-md overflow-x-auto border border-gray-200">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b text-gray-600 uppercase text-xs">
                            <th class="p-3">วันที่ / ช่วงเวลา</th>
                            <th class="p-3">ยอดผลิต</th>
                            <th class="p-3">ของเสีย (ชิ้น)</th>
                            <th class="p-3">% Scrap Rate</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="divide-y text-sm">
                        <!-- Data Rows will be dynamically added here -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        // Set today's date in form and header
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('th-TH');
        document.getElementById('entryDate').valueAsDate = new Date();

        // Sample initial data (Stored in LocalStorage if exists)
        let defaultData = [
            { date: '2026-09-01', total: 1000, scrap: 12 },
            { date: '2026-09-02', total: 1200, scrap: 18 },
            { date: '2026-09-03', total: 1100, scrap: 9 },
            { date: '2026-09-04', total: 1050, scrap: 15 },
            { date: '2026-09-05', total: 950,  scrap: 20 },
            { date: '2026-09-08', total: 1300, scrap: 10 },
            { date: '2026-09-09', total: 1250, scrap: 14 }
        ];

        let scrapData = JSON.parse(localStorage.getItem('scrapData')) || defaultData;
        let currentFilter = 'daily';
        let chartInstance = null;

        // Auto calculate Scrap Rate on input
        const totalInput = document.getElementById('totalProd');
        const scrapInput = document.getElementById('scrapQty');
        const rateInput = document.getElementById('scrapRate');

        function calcRate() {
            const total = parseFloat(totalInput.value) || 0;
            const scrap = parseFloat(scrapInput.value) || 0;
            if (total > 0) {
                const rate = ((scrap / total) * 100).toFixed(2);
                rateInput.value = rate + ' %';
            } else {
                rateInput.value = '0.00 %';
            }
        }
        totalInput.addEventListener('input', calcRate);
        scrapInput.addEventListener('input', calcRate);

        // Form Submit
        document.getElementById('dataForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const date = document.getElementById('entryDate').value;
            const total = parseInt(document.getElementById('totalProd').value);
            const scrap = parseInt(document.getElementById('scrapQty').value);

            // Add or update existing record
            const existingIndex = scrapData.findIndex(item => item.date === date);
            if (existingIndex > -1) {
                scrapData[existingIndex] = { date, total, scrap };
            } else {
                scrapData.push({ date, total, scrap });
            }

            // Save to LocalStorage
            localStorage.setItem('scrapData', JSON.stringify(scrapData));
            
            // Reset form
            document.getElementById('scrapQty').value = '';
            document.getElementById('totalProd').value = '';
            rateInput.value = '0.00 %';

            updateDashboard();
        });

        // Set Active Filter Button
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            document.getElementById(`btn-${filter}`).classList.remove('bg-gray-200', 'text-gray-700');
            document.getElementById(`btn-${filter}`).classList.add('bg-blue-600', 'text-white');

            updateDashboard();
        }

        // Aggregate Data based on Filter
        function getAggregatedData() {
            // Sort data by date
            scrapData.sort((a, b) => new Date(a.date) - new Date(b.date));

            if (currentFilter === 'daily') {
                return scrapData.map(d => ({
                    label: d.date,
                    total: d.total,
                    scrap: d.scrap,
                    rate: ((d.scrap / d.total) * 100).toFixed(2)
                }));
            }

            const grouped = {};
            scrapData.forEach(d => {
                const dateObj = new Date(d.date);
                let key = '';

                if (currentFilter === 'weekly') {
                    // Simple Week Grouping (Year-Week)
                    const year = dateObj.getFullYear();
                    const firstJan = new Date(year, 0, 1);
                    const weekNum = Math.ceil((((dateObj - firstJan) / 86400000) + firstJan.getDay() + 1) / 7);
                    key = `${year}-W${weekNum}`;
                } else if (currentFilter === 'monthly') {
                    key = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
                } else if (currentFilter === 'yearly') {
                    key = `${dateObj.getFullYear()}`;
                }

                if (!grouped[key]) {
                    grouped[key] = { total: 0, scrap: 0 };
                }
                grouped[key].total += d.total;
                grouped[key].scrap += d.scrap;
            });

            return Object.keys(grouped).map(key => ({
                label: key,
                total: grouped[key].total,
                scrap: grouped[key].scrap,
                rate: grouped[key].total > 0 ? ((grouped[key].scrap / grouped[key].total) * 100).toFixed(2) : 0
            }));
        }

        // Update Dashboard UI
        function updateDashboard() {
            const processedData = getAggregatedData();

            // Update KPI Cards
            const totalProdSum = processedData.reduce((acc, curr) => acc + Number(curr.total), 0);
            const totalScrapSum = processedData.reduce((acc, curr) => acc + Number(curr.scrap), 0);
            const avgRate = totalProdSum > 0 ? ((totalScrapSum / totalProdSum) * 100).toFixed(2) : 0;

            document.getElementById('kpiTotalProd').innerText = totalProdSum.toLocaleString();
            document.getElementById('kpiTotalScrap').innerText = totalScrapSum.toLocaleString();
            document.getElementById('kpiAvgRate').innerText = `${avgRate}%`;

            // Update Data Table
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = '';
            processedData.slice().reverse().forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3 font-medium">${row.label}</td>
                    <td class="p-3">${row.total.toLocaleString()}</td>
                    <td class="p-3 text-red-600 font-medium">${row.scrap.toLocaleString()}</td>
                    <td class="p-3"><span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">${row.rate}%</span></td>
                `;
                tbody.appendChild(tr);
            });

            // Update Chart
            renderChart(processedData);
        }

        // Render Chart.js
        function renderChart(data) {
            const ctx = document.getElementById('scrapChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.label),
                    datasets: [
                        {
                            label: '% Scrap Rate',
                            data: data.map(d => d.rate),
                            borderColor: '#EF4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            yAxisID: 'y1',
                            type: 'line'
                        },
                        {
                            label: 'Scrap Qty (ชิ้น)',
                            data: data.map(d => d.scrap),
                            backgroundColor: '#3B82F6',
                            yAxisID: 'y',
                            type: 'bar'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: 'จำนวนของเสีย (ชิ้น)' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: '% Scrap Rate' },
                            ticks: { callback: value => value + '%' }
                        }
                    }
                }
            });
        }

        // Initial Load
        updateDashboard();
    </script>
</body>
</html>
