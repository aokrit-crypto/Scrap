<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Scrap Dashboard</title>
    
    <!-- PapaParse, SheetJS (สำหรับอ่าน Excel) & Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0f141d; color: #ffffff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }
        h1 { color: #3b82f6; font-size: 24px; }

        /* Filter Buttons */
        .filter-group {
            display: flex; background-color: #151b26; border: 1px solid #1e2736;
            border-radius: 8px; padding: 4px; gap: 4px;
        }
        .btn-filter {
            background: none; border: none; color: #9ba4b5; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
            transition: all 0.2s;
        }
        .btn-filter.active { background-color: #3b82f6; color: #ffffff; }

        /* KPI Cards */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background-color: #151b26; border: 1px solid #1e2736; border-radius: 10px; padding: 18px; }
        .kpi-title { font-size: 12px; color: #9ba4b5; margin-bottom: 8px; }
        .kpi-value { font-size: 24px; font-weight: 700; color: #ffffff; }
        .kpi-badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 5px; }
        .badge-red { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-blue { background-color: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        /* Cards & Action Section */
        .card { background-color: #151b26; border: 1px solid #1e2736; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 600; color: #ffffff; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        /* Form & Import Controls */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .action-grid { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #9ba4b5; margin-bottom: 5px; }
        .form-control {
            width: 100%; background-color: #1e2736; border: 1px solid #2d3748;
            border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 13px;
        }
        .btn-submit {
            width: 100%; background-color: #10b981; color: white; border: none;
            padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 5px;
        }
        .btn-submit:hover { background-color: #059669; }

        /* Upload Box */
        .upload-box {
            border: 2px dashed #3b82f6; border-radius: 8px; padding: 30px;
            text-align: center; background-color: rgba(59, 130, 246, 0.05);
            cursor: pointer; transition: all 0.2s;
        }
        .upload-box:hover { background-color: rgba(59, 130, 246, 0.1); }
        .upload-icon { font-size: 32px; color: #3b82f6; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header & View Filters -->
        <div class="header-bar">
            <h1>🏭 Production Scrap Dashboard</h1>
            <div class="filter-group">
                <button class="btn-filter active" onclick="setPeriod('daily', this)">รายวัน</button>
                <button class="btn-filter" onclick="setPeriod('weekly', this)">รายสัปดาห์</button>
                <button class="btn-filter" onclick="setPeriod('monthly', this)">รายเดือน</button>
                <button class="btn-filter" onclick="setPeriod('yearly', this)">รายปี</button>
            </div>
        </div>

        <!-- Summary KPIs -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-title">ยอดการผลิตทั้งหมด (Total Output)</div>
                <div class="kpi-value" id="totalOutput">0</div>
                <span class="kpi-badge badge-blue">PCS</span>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">ของเสียทั้งหมด (Total Scrap)</div>
                <div class="kpi-value" id="totalScrap" style="color: #ef4444;">0</div>
                <span class="kpi-badge badge-red">PCS</span>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">เปอร์เซ็นต์ของเสีย (Scrap Rate)</div>
                <div class="kpi-value" id="scrapRate" style="color: #f59e0b;">0%</div>
                <span class="kpi-badge badge-red">% Rate</span>
            </div>
        </div>

        <!-- Main Chart -->
        <div class="card">
            <div class="card-title" id="chartTitle"><i class="fa-solid fa-chart-line"></i> แนวโน้มของเสีย (Scrap Trend)</div>
            <div style="height: 320px;">
                <canvas id="scrapChart"></canvas>
            </div>
        </div>

        <!-- Data Input & Excel Import Section (แทนที่ตารางเดิม) -->
        <div class="action-grid">
            <!-- 1. ปุ่มอัปโหลดไฟล์ Excel / CSV -->
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-file-excel" style="color: #10b981;"></i> อัปโหลดไฟล์ Excel / CSV</div>
                <div class="upload-box" onclick="document.getElementById('excelFileInput').click()">
                    <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                    <p style="font-size: 14px; font-weight: 600; color: #fff;">คลิกเพื่อเลือกไฟล์ Excel หรือ CSV</p>
                    <p style="font-size: 12px; color: #9ba4b5; margin-top: 5px;">รองรับไฟล์ .xlsx, .xls, .csv</p>
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleFileUpload(event)">
                </div>
            </div>

            <!-- 2. ฟอร์มเพิ่มข้อมูลประจำวัน -->
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-plus" style="color: #3b82f6;"></i> ป้อนข้อมูลของเสียใหม่</div>
                <form id="scrapForm" onsubmit="addNewData(event)">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label>วันที่ (Date)</label>
                            <input type="date" id="inputDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Material / Model</label>
                            <input type="text" id="inputModel" placeholder="เช่น CAB FOAM" class="form-control" required>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label>ยอดผลิต (Production Qty)</label>
                            <input type="number" id="inputProd" placeholder="0" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>ของเสีย (Scrap Qty)</label>
                            <input type="number" id="inputScrap" placeholder="0" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit"><i class="fa-solid fa-plus"></i> เพิ่มข้อมูลลงใน Dashboard</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const csvFilePath = './data.csv';
        let rawData = [];
        let currentPeriod = 'daily';
        let scrapChartInstance = null;

        // ดึงข้อมูลเริ่มต้นจาก data.csv บน Repository
        Papa.parse(csvFilePath, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                rawData = results.data;
                renderDashboard();
            },
            error: function() {
                console.log("ไม่พบไฟล์ data.csv เริ่มต้น เริ่มใช้ข้อมูลเปล่า");
                renderDashboard();
            }
        });

        // 1. ฟังก์ชันนำเข้าไฟล์ Excel / CSV Direct จากเครื่อง
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            if (file.name.endsWith('.csv')) {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        rawData = results.data;
                        renderDashboard();
                        alert('✅ นำเข้าข้อมูลจาก CSV สำเร็จเรียบร้อย!');
                    }
                });
            } else {
                // อ่านไฟล์ .xlsx / .xls ด้วย SheetJS
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    rawData = XLSX.utils.sheet_to_json(worksheet);
                    renderDashboard();
                    alert('✅ นำเข้าข้อมูลจากไฟล์ Excel สำเร็จเรียบร้อย!');
                };
                reader.readAsArrayBuffer(file);
            }
        }

        // 2. ฟังก์ชันป้อนข้อมูลใหม่ผ่านหน้าเว็บ
        function addNewData(e) {
            e.preventDefault();
            const date = document.getElementById('inputDate').value;
            const model = document.getElementById('inputModel').value;
            const prod = document.getElementById('inputProd').value;
            const scrap = document.getElementById('inputScrap').value;

            rawData.push({
                'Date': date,
                'Model': model,
                'ProductionQty': prod,
                'ScrapQty': scrap
            });

            renderDashboard();
            document.getElementById('scrapForm').reset();
            alert('✅ เพิ่มข้อมูลใหม่เข้า Dashboard เรียบร้อยแล้ว!');
        }

        function setPeriod(period, btn) {
            currentPeriod = period;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderDashboard();
        }

        function renderDashboard() {
            if (rawData.length === 0) return;

            const grouped = {};
            let globalProd = 0;
            let globalScrap = 0;

            rawData.forEach(row => {
                const dateStr = row['Date'];
                if (!dateStr) return;

                const prod = parseFloat(row['ProductionQty']) || 0;
                const scrap = parseFloat(row['ScrapQty']) || 0;
                globalProd += prod;
                globalScrap += scrap;

                const date = new Date(dateStr);
                let key = dateStr;

                if (currentPeriod === 'weekly') {
                    key = `${date.getFullYear()}-W${getWeekNumber(date)}`;
                } else if (currentPeriod === 'monthly') {
                    key = dateStr.substring(0, 7);
                } else if (currentPeriod === 'yearly') {
                    key = dateStr.substring(0, 4);
                }

                if (!grouped[key]) grouped[key] = { prod: 0, scrap: 0 };
                grouped[key].prod += prod;
                grouped[key].scrap += scrap;
            });

            // อัปเดต KPIs
            document.getElementById('totalOutput').innerText = globalProd.toLocaleString();
            document.getElementById('totalScrap').innerText = globalScrap.toLocaleString();
            const rate = globalProd > 0 ? ((globalScrap / globalProd) * 100).toFixed(2) : 0;
            document.getElementById('scrapRate').innerText = `${rate}%`;

            // อัปเดตกราฟ
            const labels = Object.keys(grouped).sort();
            const scrapData = labels.map(k => grouped[k].scrap);
            const rateData = labels.map(k => grouped[k].prod > 0 ? ((grouped[k].scrap / grouped[k].prod) * 100).toFixed(2) : 0);

            updateChart(labels, scrapData, rateData);
        }

        function updateChart(labels, scrapData, rateData) {
            const ctx = document.getElementById('scrapChart').getContext('2d');
            if (scrapChartInstance) scrapChartInstance.destroy();

            const periodNames = { daily: 'รายวัน', weekly: 'รายสัปดาห์', monthly: 'รายเดือน', yearly: 'รายปี' };
            document.getElementById('chartTitle').innerHTML = `<i class="fa-solid fa-chart-line"></i> แนวโน้มของเสีย และ Scrap Rate (%) - ${periodNames[currentPeriod]}`;

            scrapChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'bar',
                            label: 'จำนวนของเสีย (PCS)',
                            data: scrapData,
                            backgroundColor: '#ef4444',
                            borderRadius: 6,
                            yAxisID: 'y'
                        },
                        {
                            type: 'line',
                            label: 'Scrap Rate (%)',
                            data: rateData,
                            borderColor: '#f59e0b',
                            borderWidth: 3,
                            fill: false,
                            tension: 0.3,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: '#9ba4b5' }, grid: { display: false } },
                        y: { 
                            type: 'linear', position: 'left',
                            ticks: { color: '#9ba4b5' }, grid: { color: '#1e2736' },
                            title: { display: true, text: 'Scrap Qty (PCS)', color: '#ef4444' }
                        },
                        y1: {
                            type: 'linear', position: 'right',
                            ticks: { color: '#f59e0b', callback: value => value + '%' },
                            grid: { display: false },
                            title: { display: true, text: 'Scrap Rate (%)', color: '#f59e0b' }
                        }
                    },
                    plugins: { legend: { labels: { color: '#9ba4b5' } } }
                }
            });
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        }
    </script>
</body>
</html>
